name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run --with pytest pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: flickaiagent:ci
      - name: Smoke test image
        run: |
          docker run -d --name api -p 8000:8000 flickaiagent:ci
          for i in $(seq 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
